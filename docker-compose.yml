version: "3.9"

services:
  freetube-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freetube-dev
    working_dir: /app
    volumes:
      # Mount source code for live reloading
      - .:/app
      # Avoid overwriting node_modules on the host
      - /app/node_modules
    ports:
      # Webpack dev server port for web mode
      - "9080:9080"
    environment:
      - NODE_ENV=development
    command: yarn dev:web
    stdin_open: true
    tty: true

  freetube-build:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freetube-build
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
    # Runs the full web production build; output goes to ./dist/web
    command: yarn pack:web
    profiles:
      - build

  freetube-web:
    image: nginx:alpine
    container_name: freetube-web
    volumes:
      # Serve the production web bundle built by freetube-build
      - ./dist/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    profiles:
      - serve
